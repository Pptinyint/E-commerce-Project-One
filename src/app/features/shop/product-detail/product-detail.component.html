<ng-container *ngIf="state$ | async as state">
  <app-spinner *ngIf="state.loading" />

  <div *ngIf="!state.loading && state.error" class="alert alert-error" role="alert">
    {{ state.error }}
    <a routerLink="/" class="btn btn-primary">Back to shop</a>
  </div>

  <section *ngIf="!state.loading && state.product as product" class="detail">
    <div class="image-wrap">
      <img [src]="product.image" [alt]="product.title" />
    </div>

    <div class="info">
      <span class="category">{{ product.category }}</span>
      <h1>{{ product.title }}</h1>
      <p class="rating">★ {{ product.rating.rate | number: '1.1-1' }} · {{ product.rating.count }} reviews</p>
      <p class="price">{{ product.price | currency: 'USD' }}</p>
      <p class="description">{{ product.description }}</p>

      <div class="buy-row">
        <div class="qty" aria-label="Quantity">
          <button type="button" class="btn btn-outline" (click)="decreaseQuantity()" aria-label="Decrease quantity">−</button>
          <input
            type="number"
            class="input qty-input"
            min="1"
            max="10"
            aria-label="Quantity"
            [formControl]="quantityControl"
          />
          <button type="button" class="btn btn-outline" (click)="increaseQuantity()" aria-label="Increase quantity">+</button>
        </div>
        <button type="button" class="btn btn-primary" (click)="addToCart(product)">Add to cart</button>
      </div>

      <a routerLink="/" class="back-link">← Continue shopping</a>
    </div>
  </section>
</ng-container>
