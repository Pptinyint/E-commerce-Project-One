<section class="shop">
  <h1>Shop all products</h1>

  <div class="toolbar">
    <input
      type="search"
      class="input search"
      placeholder="Search products…"
      aria-label="Search products"
      [formControl]="searchControl"
    />
    <select class="input category" aria-label="Filter by category" [formControl]="categoryControl">
      <option value="all">All categories</option>
      <option *ngFor="let category of categories$ | async" [value]="category">
        {{ category }}
      </option>
    </select>
  </div>

  <ng-container *ngIf="viewModel$ | async as vm">
    <app-spinner *ngIf="vm.loading" />

    <div *ngIf="!vm.loading && vm.error" class="alert alert-error" role="alert">
      {{ vm.error }}
    </div>

    <p *ngIf="!vm.loading && !vm.error && vm.products.length === 0" class="empty">
      No products match your search. Try a different keyword or category.
    </p>

    <div *ngIf="!vm.loading && !vm.error && vm.products.length > 0" class="grid">
      <app-product-card *ngFor="let product of vm.products" [product]="product" />
    </div>
  </ng-container>
</section>
